name: CI / Build & Push (debug login)

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm ci
      - run: npm test --silent

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker & secrets presence (masked)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "Docker version:"
          docker --version || true
          # show that secret exists (it will be masked in logs)
          echo "Secret DOCKERHUB_USERNAME (masked): $DH_USER"

      - name: Attempt docker login (explicit CLI)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -x
          docker logout || true
          # show length of token (masked) and user to ensure runner got something
          echo "Username length: $(printf '%s' "$DH_USER" | wc -c)"
          echo "Token length: $(printf '%s' "$DH_TOKEN" | wc -c)"
          # attempt login (this prints docker error messages if any)
          echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin
          echo "docker login exit code: $?"
          set +x

      - name: Build and push image (only if login succeeded)
        if: success()
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo-161125:latest
