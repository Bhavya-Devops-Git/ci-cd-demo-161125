name: CI / Build & Push (debug login)

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm ci
      - run: npm test --silent
      
  deploy:
   name: Deploy to EC2
   runs-on: ubuntu-latest
   needs: build           # <-- change this if your build job is named something else
   steps:
    - name: Deploy via SSH (pull & restart docker-compose)
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_SSH_PORT }}   # optional, remove or leave if not set
        script: |
          set -e
          cd ~/ci-cd-demo-161125-deploy
          # If your image is private on Docker Hub, uncomment and set DOCKERHUB secrets, then login:
          # echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker-compose pull
          docker-compose up -d --force-recreate --remove-orphans
          docker-compose ps
          # smoke test: fail the job if health endpoint not HTTP 200
          curl -fS http://localhost/health

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker & secrets presence (masked)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "Docker version:"
          docker --version || true
          # show that secret exists (it will be masked in logs)
          echo "Secret DOCKERHUB_USERNAME (masked): $DH_USER"

      - name: Attempt docker login (explicit CLI)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -x
          docker logout || true
          # show length of token (masked) and user to ensure runner got something
          echo "Username length: $(printf '%s' "$DH_USER" | wc -c)"
          echo "Token length: $(printf '%s' "$DH_TOKEN" | wc -c)"
          # attempt login (this prints docker error messages if any)
          echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin
          echo "docker login exit code: $?"
          set +x

      - name: Build and push image (only if login succeeded)
        if: success()
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo-161125:latest
