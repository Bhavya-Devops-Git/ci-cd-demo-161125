name: CI/CD Pipeline (tagged images)

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: bhavya161125/ci-cd-demo-161125

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --silent

  build:
    name: Build and push Docker image (with tag)
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: set_tag
        run: |
          short_sha=${GITHUB_SHA::7}
          echo "image_tag=$short_sha" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build image (tagged with SHA and latest)
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.image_tag }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Push both tags
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.image_tag }}
          docker push ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to EC2 with specific tag
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH (pull -> up with IMAGE_TAG)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            echo "Deploy start: $GITHUB_SHA"
            cd ~/ci-cd-demo-161125-deploy

            # set IMAGE_TAG to the value passed from the workflow (expanded on runner)
            IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            echo "Using IMAGE_TAG=${IMAGE_TAG}"

            # optional: login to Docker Hub on server if private images
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
              echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            # ensure old containers cleaned
            docker-compose down --remove-orphans || true

            # export IMAGE_TAG into the environment used by docker-compose substitution
            export IMAGE_TAG

            # pull specifically the image tag (helps caching)
            docker pull ${{ env.IMAGE_NAME }}:${IMAGE_TAG} || true
            docker pull ${{ env.IMAGE_NAME }}:latest || true

            # start using the substituted tag
            docker-compose up -d --force-recreate --remove-orphans

            # verify health (same robust loop as before)
            HEALTH_URL="http://localhost/health"
            MAX_ATTEMPTS=5
            SLEEP_SEC=10
            attempt=1
            until curl -fsS "$HEALTH_URL" >/dev/null 2>&1; do
              echo "Healthcheck attempt $attempt/$MAX_ATTEMPTS failed"
              attempt=$((attempt + 1))
              if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
                echo "Healthcheck failed. Dumping logs..."
                docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
                docker-compose logs --tail=200 || true
                exit 1
              fi
              sleep "$SLEEP_SEC"
            done

            echo "Deploy succeeded for tag ${IMAGE_TAG}"

