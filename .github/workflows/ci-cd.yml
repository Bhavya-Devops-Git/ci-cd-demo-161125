name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: bhavya161125/ci-cd-demo-161125
  IMAGE_TAG: latest

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --silent

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to EC2 (robust docker-compose)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH (pull -> down -> up -> healthcheck)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}    # optional; usually 22
          script: |
            set -euo pipefail
            echo "=== DEPLOY START $(date -u) ==="
            cd ~/ci-cd-demo-161125-deploy

            echo "---- docker-compose.yml preview ----"
            sed -n '1,200p' docker-compose.yml || true
            echo "-------------------------------------"

            # Login to Docker Hub on the server if creds provided
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
              echo "Logging in to Docker Hub..."
              echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            # Safe cleanup
            echo "Stopping & removing existing compose containers (if any)..."
            docker-compose down --remove-orphans || true

            # Pull latest images
            echo "Pulling images..."
            docker-compose pull

            # Start containers
            echo "Starting up containers..."
            docker-compose up -d --force-recreate --remove-orphans

            # Robust healthcheck loop
            echo "Waiting for health endpoint..."
            HEALTH_URL="http://localhost/health"
            MAX_ATTEMPTS=5
            SLEEP_SEC=10
            attempt=1
            until curl -fsS "$HEALTH_URL" >/dev/null 2>&1; do
              echo "Healthcheck attempt $attempt/$MAX_ATTEMPTS failed, waiting ${SLEEP_SEC}s..."
              attempt=$((attempt + 1))
              if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
                echo "Healthcheck failed after ${MAX_ATTEMPTS} attempts. Gathering debug info..."
                echo "---- docker ps ----"
                docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
                echo "---- docker-compose logs (last 200 lines) ----"
                docker-compose logs --tail=200 || true
                echo "---- inspect first running container (if any) ----"
                first_container=$(docker ps -q | head -n 1 || true)
                if [ -n "$first_container" ]; then
                  docker inspect --format '{{json .State}}' "$first_container" || true
                fi
                echo "Failing the deploy job."
                exit 1
              fi
              sleep "$SLEEP_SEC"
            done

            echo "Healthcheck passed."
            echo "==== DEPLOY SUCCESS $(date -u) ===="
