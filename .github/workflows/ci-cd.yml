name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: bhavya161125/ci-cd-demo-161125
  IMAGE_TAG: latest

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test --silent

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and tag image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
   name: Deploy to EC2 (docker-compose)
   runs-on: ubuntu-latest
   needs: build
   steps:
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.8.1
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

    - name: Deploy via SSH (docker login -> pull -> up)
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      run: |
        # NOTE: we use SSH and pass env vars in; the server will run docker login with the secrets below
        ssh -o StrictHostKeyChecking=no -p ${DEPLOY_SSH_PORT:-22} ${DEPLOY_USER}@${DEPLOY_HOST} << 'EOF'
          set -e
          cd ~/ci-cd-demo-161125-deploy

          # If your image is private on Docker Hub -> login non-interactively
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            echo "Logging in to Docker Hub on the server..."
            echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          fi

          # Pull and restart using docker-compose
          docker-compose pull
          docker-compose up -d --force-recreate --remove-orphans
          docker-compose ps

          # Smoke test
          curl -fS http://localhost/health
        EOF
