name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show run context
        run: |
          echo "EVENT: $GITHUB_EVENT_NAME"
          echo "REF: $GITHUB_REF"
          echo "REPO: $GITHUB_REPOSITORY"
          echo "HEAD REF: $GITHUB_HEAD_REF"
          echo "BASE REF: $GITHUB_BASE_REF"

      - name: Show secrets (masked)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Username length: $(printf '%s' "$DH_USER" | wc -c)"
          echo "Token length: $(printf '%s' "$DH_TOKEN" | wc -c)"
          sample="$(printf '%s' "$DH_TOKEN" | sed -E 's/^(.{4}).*(.{4})$/\1....\2/')"
          echo "Masked token sample: $sample"

      - name: Docker login test
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin || true
